[project]
name = "mts-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.31",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.7",
    "motor>=3.4.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "yfinance>=0.2.40",
    "anthropic>=0.40.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "kiteconnect>=5.0.1",
    "slowapi>=0.1.9",
    "feedparser>=6.0.0",
    "apscheduler>=3.10.0",
    "cryptography>=42.0.0",
    "pyotp>=2.9.0",
    "psycopg2-binary>=2.9.9",
    "sentry-sdk[fastapi]>=2.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "types-python-jose>=3.3.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter-declaration idiom (`body: dict = Body(...)`, likewise
# Depends/Query/Path/etc.) relies on calling these in argument defaults --
# that's the framework's documented pattern, not the mutable-default bug B008
# looks for.
extend-immutable-calls = [
    "fastapi.Body", "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Header", "fastapi.Cookie", "fastapi.Form", "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# HTML email templates: long lines come from inline CSS/markup, not Python
# style -- wrapping them risks breaking rendering for no readability gain.
"app/infra/email/report.py" = ["E501"]
"app/infra/email/golden_stock_report.py" = ["E501"]
"app/infra/email/btst_report.py" = ["E501"]
"app/infra/email/dsws_report.py" = ["E501"]
"app/infra/email/mcx_trend_report.py" = ["E501"]
"app/infra/email/mcx_extreme_alert_report.py" = ["E501"]
"app/infra/email/mcx_strategy_signal_alert_report.py" = ["E501"]
"app/infra/email/golden_egg_report.py" = ["E501"]
"app/infra/email/zerodha_token_reminder.py" = ["E501"]
"app/services/stock_of_day_service.py" = ["E501"]
"app/infra/monitoring/position_monitor.py" = ["E501"]
"app/infra/email/chartink_report.py" = ["E501"]
"app/infra/email/mcx_signal_alert_report.py" = ["E501"]
"app/infra/email/rsi_signal_alert_report.py" = ["E501"]
# Trading agent's knowledge base is almost entirely long natural-language
# answer strings -- same rationale as the email templates above.
"app/api/v1/trading_agent.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Third-party packages without type stubs (yfinance, etc.) are treated as Any.
ignore_missing_imports = true

# Legacy modules with unresolved typing debt are excluded from mypy checks.
# New modules must pass. Remove entries here as each module is cleaned up.
[[tool.mypy.overrides]]
module = [
    "app.api.v1.ai",
    "app.api.v1.alerts",
    "app.api.v1.btst",
    "app.api.v1.custom_screener",
    "app.api.v1.discovery",
    "app.api.v1.golden_egg",
    "app.api.v1.golden_stock",
    "app.api.v1.kotegawa",
    "app.api.v1.kotegawa_early",
    "app.api.v1.kotegawa_intraday",
    "app.api.v1.portfolio",
    "app.api.v1.scanner",
    "app.api.v1.stock_of_day",
    "app.api.v1.strategy_api",
    "app.domain.services.backtester",
    "app.domain.services.strategy_lab.rsi_reversion_live",
    "app.domain.services.strategy_lab.rsi_reversion_v2",
    "app.infra.db.repositories.btst_repo",
    "app.infra.db.repositories.email_list_repo",
    "app.infra.db.repositories.golden_stock_repo",
    "app.infra.db.repositories.historical_candle_repo",
    "app.infra.db.repositories.kotegawa_early_repo",
    "app.infra.db.repositories.kotegawa_intraday_repo",
    "app.infra.db.repositories.kotegawa_repo",
    "app.infra.db.repositories.order_repo",
    "app.infra.discovery.sentiment",
    "app.infra.email.client",
    "app.infra.market_data.google_finance_client",
    "app.infra.monitoring.position_monitor",
    "app.infra.scanner.chartink_poller",
    "app.main",
    "app.services.chartink_signal_service",
    "app.services.forecast_service",
    "app.services.mcx_global_symbols_service",
    "app.services.mcx_rsi_signal_service",
    "app.services.performance_dashboard_service",
    "app.services.portfolio_ohlc_service",
    "app.services.portfolio_summary_service",
    "app.services.stock_of_day_service",
    "app.services.watchlist_history_service",
    "tests.conftest",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
